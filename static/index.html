<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <title>Zenith</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0b0f19" />

  <!-- iOS'a ozel: Safari standart manifest'i tam desteklemez, bu etiketler
       "Ana Ekrana Ekle" ile gercek bir uygulama gibi acilmasini saglar -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Zenith" />
  <link rel="apple-touch-icon" href="/static/icons/icon-180.png" />
  <link rel="icon" href="/static/icons/icon-192.png" />

  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div id="sidebar-overlay" hidden></div>
  <aside id="sidebar" hidden>
    <div class="sidebar-head">
      <span>Sohbetler</span>
      <div class="sidebar-head-actions">
        <button id="new-chat-btn" title="Yeni sohbet">+ Yeni</button>
        <button id="sidebar-close" title="Kapat" aria-label="Kapat">&times;</button>
      </div>
    </div>
    <div id="conversation-list"></div>
    <a id="sidebar-trading" href="/trading">&#128200; Portfoy grafigi</a>
  </aside>

  <div id="app">
    <header>
      <div class="brand">
        <button id="menu-btn" title="Sohbetler" aria-label="Sohbetler">&#9776;</button>
        <span class="logo">Z</span>
        <h1>Zenith</h1>
      </div>
      <div class="controls">
        <label class="switch">
          <input type="checkbox" id="council-toggle" />
          <span>Konsey</span>
        </label>
        <label class="switch">
          <input type="checkbox" id="agent-toggle" />
          <span>Ajan</span>
        </label>
        <label class="switch">
          <input type="checkbox" id="tts-toggle" />
          <span>Sesli</span>
        </label>
        <select id="model-select" title="Model sec">
          <option value="">Oto model</option>
        </select>
        <a id="trading-btn" href="/trading" title="Portfoy grafigi">&#128200;</a>
        <button id="export-btn" title="Sohbeti indir">&#8681;</button>
      </div>
    </header>

    <main id="chat">
      <div id="welcome">
        <span class="welcome-logo">Z</span>
        <h2>Merhaba, ben Zenith.</h2>
        <p>Birden fazla ucretsiz yapay zeka modelini birlikte calistiran kisisel asistaniniz. Ne yapmami istersiniz, efendim?</p>
        <div class="chips">
          <button class="chip" data-fill="wiki: kara delik">Wikipedia&apos;dan ozet</button>
          <button class="chip" data-fill="hava: Istanbul">Hava durumu</button>
          <button class="chip" data-fill="kur: 100 dolar tl">Doviz kuru</button>
          <button class="chip" data-fill="haber: ">Son haberler</button>
          <button class="chip" data-fill="sifre: 20">Sifre uret</button>
          <button class="chip" data-fill="not: ">Not al</button>
          <button class="chip" data-fill="ara: bugun teknoloji haberleri">Web&apos;de ara</button>
          <button class="chip" data-fill="fiyat XAUUSD">Altin fiyati</button>
          <button class="chip" data-fill="piyasa tara: HEPSI">Piyasa taramasi</button>
          <button class="chip" data-send="__trading__">Strateji analizi (ajan)</button>
          <button class="chip" data-send="__council__">Konseye bir soru sor</button>
        </div>
      </div>
    </main>

    <div id="image-preview" hidden>
      <img id="image-thumb" alt="secilen gorsel" />
      <button id="image-remove" title="Gorseli kaldir">&times;</button>
    </div>

    <form id="chat-form">
      <input type="file" id="image-input" accept="image/*" hidden />
      <input type="file" id="doc-input" accept=".txt,.md,.csv,.json,text/*" hidden />
      <button type="button" id="attach-btn" title="Gorsel ekle">&#128206;</button>
      <button type="button" id="doc-btn" title="Belge yukle (RAG)">&#128196;</button>
      <textarea id="chat-input" placeholder="Zenith'e bir sey sor..." rows="1" autofocus></textarea>
      <button type="button" id="mic-btn" title="Sesle yaz" hidden>&#127908;</button>
      <button type="button" id="voice-btn" title="Sesli konusma modu" hidden>&#128266;</button>
      <button type="submit" id="send-btn" title="Gonder">&#10148;</button>
    </form>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
