[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[project]
name = "zenith"
version = "0.2.0"
description = "Zenith: Personal AI assistant with multiple free models, council mode, skills, and PWA interface"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Zenith Contributors"}]
license = {text = "MIT"}
keywords = [
    "ai",
    "assistant",
    "llm",
    "free",
    "multi-model",
    "council",
    "pwa",
    "jarvis",
    "chatbot",
    "rag",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/gyh52ckbw5-creator/Zenith"
Repository = "https://github.com/gyh52ckbw5-creator/Zenith"
Documentation = "https://github.com/gyh52ckbw5-creator/Zenith/blob/main/README.md"
Issues = "https://github.com/gyh52ckbw5-creator/Zenith/issues"

[project.scripts]
zenith = "zenith.cli:main"
zenith-web = "zenith.server:run"

[tool.poetry.dependencies]
python = "^3.10"
aiohttp = "^3.9.0"
aiofiles = "^23.2.1"
fastapi = "^0.104.0"
uvicorn = "^0.24.0"
pydantic = "^2.5.0"
litellm = "^1.45.0"
pyyaml = "^6.0"
python-dotenv = "^1.0.0"
httpx = "^0.25.0"
ddgs = "^3.9.0"
beautifulsoup4 = "^4.12.0"
pillow = "^10.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
pytest-cov = "^4.1.0"
black = "^23.12.0"
isort = "^5.13.0"
flake8 = "^6.1.0"
mypy = "^1.7.0"

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-v --cov=zenith --cov-report=term-missing"
asyncio_mode = "auto"
