# Zenith model registry
#
# Her giriş bir "ücretsiz" AI modelini tanımlar. `litellm_id` alanı, LiteLLM'in
# ilgili sağlayıcıyı çağırmak için kullandığı kimliktir (bkz. https://docs.litellm.ai/docs/providers).
#
# requires_key: Bu sağlayıcıyı kullanmak için gereken ortam değişkeninin adı.
#               null ise (örn. Ollama), anahtar gerekmez - sadece yerel Ollama'nın
#               çalışıyor olması yeterlidir.
#
# tags: Router'ın modeli hangi görev türleri için tercih edeceğini belirler.
#       ("chat", "code", "reasoning", "fast", "vision")
#
# priority: Küçük sayı = daha yüksek öncelik. Aynı anahtar mevcutsa/Ollama
#           kuruluysa, router bu sırayla dener (fallback zinciri).
#
# NOT: Sağlayıcıların "ücretsiz katman" modelleri zamanla değişebilir. Bu liste
# 2026 başı itibarıyla bilinen ücretsiz/ücretsiz-katman modelleri baz alır.
# Kendi hesabınızdaki güncel ücretsiz model listesini kontrol edip bu dosyayı
# güncelleyebilirsiniz.

models:
  # --- Yerel, tamamen ücretsiz (internet gerekmez, API anahtarı gerekmez) ---
  - name: ollama-llama3.1-8b
    litellm_id: ollama/llama3.1
    provider: ollama
    requires_key: null
    tags: [chat, fast, local]
    priority: 10

  - name: ollama-qwen2.5-7b
    litellm_id: ollama/qwen2.5
    provider: ollama
    requires_key: null
    tags: [chat, code, local]
    priority: 11

  - name: ollama-deepseek-r1-8b
    litellm_id: ollama/deepseek-r1
    provider: ollama
    requires_key: null
    tags: [reasoning, local]
    priority: 12

  # --- Groq ücretsiz katman (çok hızlı, cömert rate-limit) ---
  - name: groq-llama-3.3-70b
    litellm_id: groq/llama-3.3-70b-versatile
    provider: groq
    requires_key: GROQ_API_KEY
    tags: [chat, reasoning, fast]
    priority: 1

  - name: groq-llama-3.1-8b-instant
    litellm_id: groq/llama-3.1-8b-instant
    provider: groq
    requires_key: GROQ_API_KEY
    tags: [chat, fast]
    priority: 2

  - name: groq-deepseek-r1-distill-70b
    litellm_id: groq/deepseek-r1-distill-llama-70b
    provider: groq
    requires_key: GROQ_API_KEY
    tags: [reasoning, code]
    priority: 3

  # --- Google AI Studio ücretsiz katman ---
  - name: gemini-2.0-flash
    litellm_id: gemini/gemini-2.0-flash
    provider: gemini
    requires_key: GEMINI_API_KEY
    tags: [chat, vision, fast]
    priority: 4

  - name: gemini-1.5-flash
    litellm_id: gemini/gemini-1.5-flash
    provider: gemini
    requires_key: GEMINI_API_KEY
    tags: [chat, vision]
    priority: 5

  # --- OpenRouter ":free" modeller (tek anahtarla düzinelerce ücretsiz modele erişim) ---
  - name: openrouter-llama-3.3-70b-free
    litellm_id: openrouter/meta-llama/llama-3.3-70b-instruct:free
    provider: openrouter
    requires_key: OPENROUTER_API_KEY
    tags: [chat, reasoning]
    priority: 6

  - name: openrouter-deepseek-r1-free
    litellm_id: openrouter/deepseek/deepseek-r1:free
    provider: openrouter
    requires_key: OPENROUTER_API_KEY
    tags: [reasoning, code]
    priority: 7

  - name: openrouter-qwen-2.5-72b-free
    litellm_id: openrouter/qwen/qwen-2.5-72b-instruct:free
    provider: openrouter
    requires_key: OPENROUTER_API_KEY
    tags: [chat, code]
    priority: 8

  # --- Cerebras ücretsiz katman (çok hızlı inference) ---
  - name: cerebras-llama-3.1-70b
    litellm_id: cerebras/llama3.1-70b
    provider: cerebras
    requires_key: CEREBRAS_API_KEY
    tags: [chat, fast, reasoning]
    priority: 9

# Council (konsey) modu: bir soruya birden fazla modelin aynı anda cevap
# verip, sonra bir "sentezleyici" modelin bu cevapları birleştirdiği mod.
council:
  max_parallel_models: 4
  synthesizer_tags: [reasoning]
