# Zenith model registry
#
# Her giris bir "ucretsiz" AI modelini tanimlar. `litellm_id`, LiteLLM'in ilgili
# saglayiciyi cagirmak icin kullandigi kimliktir (https://docs.litellm.ai/docs/providers).
#
# requires_key: Bu saglayici icin gereken ortam degiskeni. null ise (Ollama)
#               anahtar gerekmez, yerel Ollama'nin calismasi yeterlidir.
# tags:         Router'in modeli hangi gorevler icin tercih edecegi
#               ("chat", "code", "reasoning", "fast", "vision", "local").
# priority:     Kucuk sayi = once denenir (fallback zinciri sirasi).
#
# ONERILEN KURULUM (tek anahtar, en cok ucretsiz model):
#   OPENROUTER_API_KEY -> https://openrouter.ai/keys
#   Hermes 3 405B, DeepSeek V3/R1, Llama 4, Qwen3, Kimi K2, GLM, gpt-oss...
#   ":free" etiketli onlarca acik kaynak model tek anahtarla gelir.
#
# GITHUB HESABIN VARSA (ekstra kayit gerektirmez):
#   GITHUB_API_KEY -> https://github.com/settings/tokens ("models:read" izni)
#   GitHub Models uzerinden GPT-4o-mini, DeepSeek-R1, Llama, Phi-4 ucretsiz.
#
# NOT: Saglayicilarin ucretsiz model listeleri zamanla degisir; guncel listeyi
# kendi hesabindan kontrol edip bu dosyayi duzenleyebilirsin.

models:
  # --- OpenRouter ":free" acik kaynak modeller (tek anahtar, en genis secim) ---
  - name: openrouter-hermes-3-405b-free
    litellm_id: openrouter/nousresearch/hermes-3-llama-3.1-405b:free
    provider: openrouter
    requires_key: OPENROUTER_API_KEY
    tags: [chat, reasoning]
    priority: 1

  - name: openrouter-deepseek-v3-free
    litellm_id: openrouter/deepseek/deepseek-chat-v3-0324:free
    provider: openrouter
    requires_key: OPENROUTER_API_KEY
    tags: [chat, code, fast]
    priority: 2

  - name: openrouter-deepseek-r1-free
    litellm_id: openrouter/deepseek/deepseek-r1:free
